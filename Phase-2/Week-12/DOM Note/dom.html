 <!-- 1, HTML event handlers / Inline HTML Attributes -->
<!-- <button onclick="alert('Button clicked!')">Alert</button> -->




<br>
<br>
<br>
<br>
<!-- The form calls the validateForm() function when submitted -->
    <form id="signupForm" onsubmit="return validateForm(event)">

        <div class="form-group">
            <div id="errorText" class="error-message"></div>
            <label for="email">Email Address:</label><br>

            <input type="text" id="email" placeholder="Enter your email" required>

            

            Password: 
            <input type="password" placeholder="Enter your password" id="password" required>
        </div>
        
        <button type="submit">Submit</button>

    </form>

    <script>
        function validateForm(event) {
            
            const emailInput = document.getElementById("email");
            const errorText = document.getElementById("errorText");
            
            // 2. Get the value and remove
            const emailValue = emailInput.value.trim();

            
            if (emailValue === "") {
                // Prevent the form from refreshing/submitting to a server
                event.preventDefault(); 
                
                // Show the error message
                errorText.textContent = "Email address cannot be empty.";
                errorText.style.display = "block";
                
                return false; // Tells the form not to submit
            }

            // 4. If it's not empty, clear errors and let the form submit
            errorText.style.display = "none";
            alert("Success! Form is being submitted.");
            return true;
        }
    </script>
